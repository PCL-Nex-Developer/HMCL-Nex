name: Java CI

on:
  push:
  pull_request:
    paths-ignore:
      - '**.md'

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'
        java-package: 'jdk+fx'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        cache-cleanup: never
    - name: Set release version
      if: startsWith(github.ref, 'refs/tags/v')
      shell: bash
      run: |
        echo "BUILD_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
        case "$GITHUB_REF_NAME" in
          *-release.*) echo "VERSION_TYPE=stable" >> "$GITHUB_ENV" ;;
          *-beta.*|*-preview.*) echo "VERSION_TYPE=dev" >> "$GITHUB_ENV" ;;
          *) echo "VERSION_TYPE=nightly" >> "$GITHUB_ENV" ;;
        esac
    - name: Prepare release signing key
      if: startsWith(github.ref, 'refs/tags/v')
      shell: bash
      env:
        HMCL_SIGNATURE_KEY_BASE64: ${{ secrets.HMCL_SIGNATURE_KEY_BASE64 }}
      run: |
        if [ -z "${HMCL_SIGNATURE_KEY_BASE64:-}" ]; then
          echo "HMCL_SIGNATURE_KEY_BASE64 is required for tagged builds" >&2
          exit 1
        fi
        key="$RUNNER_TEMP/hmcl-signature-key.pk8"
        printf '%s' "$HMCL_SIGNATURE_KEY_BASE64" | base64 --decode > "$key"
        test -s "$key"
        chmod 600 "$key"
        echo "HMCL_SIGNATURE_KEY=$key" >> "$GITHUB_ENV"
        unset HMCL_SIGNATURE_KEY_BASE64
    - name: Install xvfb
      run: sudo apt-get update && sudo apt-get install -y xvfb
    - name: Build with Gradle
      run: xvfb-run -a ./gradlew build --no-daemon --parallel
      env:
        MICROSOFT_AUTH_ID: ${{ secrets.CLIENT_ID }}
        CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    - name: Get short SHA
      run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
    - name: Upload JAR
      uses: actions/upload-artifact@v7
      with:
        name: HMCL-${{ env.SHORT_SHA }}-jar
        path: HMCL/build/libs/HMCL-*.jar*
    - name: Upload EXE
      uses: actions/upload-artifact@v7
      with:
        name: HMCL-${{ env.SHORT_SHA }}-exe
        path: HMCL/build/libs/HMCL-*.exe*
    - name: Upload SH
      uses: actions/upload-artifact@v7
      with:
        name: HMCL-${{ env.SHORT_SHA }}-sh
        path: HMCL/build/libs/HMCL-*.sh*
    - name: Upload DEB
      uses: actions/upload-artifact@v7
      with:
        name: HMCL-${{ env.SHORT_SHA }}-deb
        path: HMCL/build/libs/HMCL-*.deb*
